[project]
name = "coinmaster-nautilus"
version = "0.1.0"
description = "NautilusTrader BTC/SOL paper-first runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nautilus_trader==1.231.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coinmaster"]
