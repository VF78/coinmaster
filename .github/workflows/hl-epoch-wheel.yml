name: Pinned HL epoch wheel

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nautilus-btc-sol-mvp
    paths:
      - .github/workflows/hl-epoch-wheel.yml
      - runtime/patches/nautilus-1.231.0-hl-connection-epoch.patch

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin isolated Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version
          cargo +1.97.1 --version
          command -v clang
          command -v clang++
          df -h .
      - name: Verify official tag and apply tracked adapter patch
        run: |
          mkdir -p "$RUNNER_TEMP/hl-wheel"
          cd "$RUNNER_TEMP/hl-wheel"
          git clone --depth 1 --branch v1.231.0 https://github.com/nautechsystems/nautilus_trader.git nautilus_trader-1.231.0
          cd nautilus_trader-1.231.0
          test "$(git rev-parse HEAD)" = 27a8e54e7ac3c57d6cbf8891f0283dfbaee97317
          test "$(git describe --tags --exact-match)" = v1.231.0
          grep -Fqx "version = \"1.231.0\"" pyproject.toml
          test -f Cargo.lock
          test -f examples/tutorials/Cargo.toml
          test -f patches/pyo3-stub-gen/Cargo.toml
          sha256sum Cargo.lock > "$RUNNER_TEMP/hl-wheel/cargo-lock.sha256"
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/runtime/patches/nautilus-1.231.0-hl-connection-epoch.patch"
          patch -p1 < "$GITHUB_WORKSPACE/runtime/patches/nautilus-1.231.0-hl-connection-epoch.patch"
          # Official build.py accepts stable/nightly aliases only. Permit the
          # exact installed 1.97.1 alias in this disposable build tree.
          sed -i "s/(\"stable\", \"nightly\")/(\"stable\", \"nightly\", \"1.97.1\")/" build.py
          grep -n "RUSTUP_TOOLCHAIN not in" build.py
      - name: Build wheel and run held-action reconnect test
        run: |
          python -m pip install build==1.3.0
          cd "$RUNNER_TEMP/hl-wheel"
          RUSTUP_TOOLCHAIN=1.97.1 CARGO_INCREMENTAL=0 python -m build --wheel --outdir "$RUNNER_TEMP/hl-wheel/nautilus_trader-1.231.0/dist" "$RUNNER_TEMP/hl-wheel/nautilus_trader-1.231.0"
          cd nautilus_trader-1.231.0
          cargo +1.97.1 test --release -p nautilus-hyperliquid held_action_post_is_not_sent_on_replacement_socket --lib
          sha256sum -c "$RUNNER_TEMP/hl-wheel/cargo-lock.sha256"
          sha256sum dist/*.whl > "$RUNNER_TEMP/hl-wheel/wheel.sha256"
          cat "$RUNNER_TEMP/hl-wheel/wheel.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-1.231.0-hl-epoch-cp312-linux-x86_64
          path: |
            ${{ runner.temp }}/hl-wheel/nautilus_trader-1.231.0/dist/*.whl
            ${{ runner.temp }}/hl-wheel/wheel.sha256
            ${{ runner.temp }}/hl-wheel/cargo-lock.sha256
          if-no-files-found: error
          retention-days: 7
